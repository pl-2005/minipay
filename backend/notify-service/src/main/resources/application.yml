server:
  port: 8105

spring:
  application:
    name: notify-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:minipay}
    username: ${POSTGRES_USER:minipay}
    password: ${POSTGRES_PASSWORD:minipay_dev_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:minipay}
    password: ${RABBITMQ_PASSWORD:minipay_dev_password}

minipay:
  notify:
    max-attempts: ${MINIPAY_NOTIFY_MAX_ATTEMPTS:3}
    retry-batch-size: ${MINIPAY_NOTIFY_RETRY_BATCH_SIZE:20}
    retry-fixed-delay-ms: ${MINIPAY_NOTIFY_RETRY_FIXED_DELAY_MS:30000}
    retry-initial-delay-ms: ${MINIPAY_NOTIFY_RETRY_INITIAL_DELAY_MS:10000}
    callback-connect-timeout-ms: ${MINIPAY_NOTIFY_CALLBACK_CONNECT_TIMEOUT_MS:2000}
    callback-read-timeout-ms: ${MINIPAY_NOTIFY_CALLBACK_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
