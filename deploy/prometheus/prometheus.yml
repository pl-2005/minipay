global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8101"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8102"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8103"]

  - job_name: merchant-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["merchant-service:8104"]

  - job_name: notify-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notify-service:8105"]

  - job_name: admin-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["admin-service:8106"]

